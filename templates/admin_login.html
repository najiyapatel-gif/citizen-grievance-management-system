<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Grievance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #102a43, #155eef);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0002;
        }

        .icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 22px;
            border-radius: 15px;
            background: #eaf1ff;
            font-size: 28px;
        }

        h1 {
            color: #102a43;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #62748a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 13px;
            font-weight: 600;
            color: #334e68;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd7e5;
            border-radius: 9px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #bfdbfe;
            border-color: #155eef;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #155eef;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #104bc4;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #eff6ff;
            color: #174ea6;
            font-size: 13px;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #155eef;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="icon">🔐</div>

        <h1>Admin Login</h1>
        <p class="subtitle">
            Sign in with your authorized administrator account
            to manage citizen complaints.
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required>

            <button type="submit">Sign In →</button>
        </form>

        <a class="back" href="{{ url_for('home') }}">
            ← Back to Citizen Portal
        </a>
    </main>
</body>
</html>
